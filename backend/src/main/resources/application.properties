spring.application.name=nutriflow
# As portas 8080 e 8090 ja estavam ocupadas nesta maquina; o frontend (vite.config.js) aponta para a mesma porta.
server.port=${NUTRIFLOW_PORTA:8765}
server.error.include-message=always

# ---- Banco de desenvolvimento: H2 em arquivo (nao precisa instalar nada) ----
spring.datasource.url=jdbc:h2:file:./data/nutriflow;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Conta do nutricionista (criada na primeira execucao) ----
nutriflow.admin.nome=${NUTRIFLOW_ADMIN_NOME:Nutricionista}
nutriflow.admin.email=${NUTRIFLOW_ADMIN_EMAIL:nutri@nutriflow.com}
nutriflow.admin.senha=${NUTRIFLOW_ADMIN_SENHA:nutri123}

# ---- Seguranca: se vazio, uma chave aleatoria e gerada a cada inicializacao ----
nutriflow.jwt.secret=${NUTRIFLOW_JWT_SECRET:}

# ---- Ambiente de demonstracao: data simulada + dados ficticios de 3 meses ----
nutriflow.demo=${NUTRIFLOW_DEMO:true}

# ---- IA: a chave fica so no backend, vinda de variavel de ambiente ----
nutriflow.gemini.api-key=${GEMINI_API_KEY:}
nutriflow.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
